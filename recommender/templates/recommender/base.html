<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TravelFit{% endblock %} - Rekomendasi Destinasi Wisata</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  {% load static %}
  <link href="{% static 'recommender/custom.css' %}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="{% url 'beranda' %}">TravelFit</a>
    <div class="navbar-nav">
      <a class="nav-link" href="{% url 'beranda' %}">Beranda</a>
      <a class="nav-link" href="/peta/">Peta</a>
      <a class="nav-link" href="/tentang/">Tentang</a>
    </div>
  </div>
</nav>
<main class="container my-4">
  {% block content %}{% endblock %}
</main>
<footer class="container text-center text-muted pb-4">
  <small>TravelFit - Sistem Pendukung Keputusan Rekomendasi Destinasi Wisata (AHP-TOPSIS)</small>
</footer>
</body>
</html>
