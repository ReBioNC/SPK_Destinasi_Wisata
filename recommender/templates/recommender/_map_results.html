{% if hasil_json %}<section class="map-results"><h3>Hasil rekomendasi terakhir</h3><ol>{% for h in hasil_json %}<li><a href="#destination-{{ h.source_id }}">{{ h.nama }}</a> <small>Skor TOPSIS {{ h.vi|floatformat:4 }}</small>{% for note in h.quality_notes %}<p class="quality-note">{{ note }}</p>{% endfor %}</li>{% endfor %}</ol></section>{% endif %}
{{ hasil_json|json_script:"hasil-data" }}
