<svg class="chart" viewBox="0 0 {{ chart.width }} {{ chart.height }}" role="img" aria-label="{{ axis }}: {% for p in chart.points %}k {{ p.k }} = {{ p.text }}{% if not forloop.last %}, {% endif %}{% endfor %}">
{% for t in chart.ticks %}<line class="grid" x1="{{ chart.left }}" x2="{{ chart.right }}" y1="{{ t.y }}" y2="{{ t.y }}"/><text class="tick" x="{{ chart.tick_x }}" y="{{ t.y }}" dy="4" text-anchor="end">{{ t.text }}</text>{% endfor %}
<polyline class="line slot-1" points="{{ chart.path }}"/>
{% for p in chart.points %}<text class="tick" x="{{ p.cx }}" y="{{ chart.axis_y }}" text-anchor="middle">{{ p.k }}</text><circle class="dot slot-1{% if p.selected %} selected{% endif %}" cx="{{ p.cx }}" cy="{{ p.cy }}" r="{% if p.selected %}6{% else %}4{% endif %}"/>{% if p.selected %}<text class="annotation" x="{{ p.cx }}" y="{{ p.cy }}" dx="10" dy="-10">{{ p.text }}</text>{% endif %}<circle class="hit" cx="{{ p.cx }}" cy="{{ p.cy }}" r="16" tabindex="0" data-tip-value="{{ p.text }}" data-tip-name="{{ p.name }}" data-tip-note="{{ p.tip }}"/>{% endfor %}
<text class="tick" x="{{ chart.left }}" y="{{ chart.title_y }}">Jumlah cluster (k)</text>
</svg>
